<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.svg">
    <title>Commande · Ma boutique</title>
</head>
<body>
    <nav>
        <a href="index.html">Accueil</a> |
        <a href="catalogue.html">Catalogue</a> |
        <a href="commande.html">Commander</a>
    </nav>

    <h1>Passez votre commande</h1>
    <form>
        <label for="nom">Nom</label><br>
        <input type="text" id="nom" required><br><br>

        <label for="email">Courriel</label><br>
        <input type="email" id="email" required><br><br>

        <label for="produit">Produit</label><br>
        <select id="produit">
            <option>T-shirt</option>
            <option>Sac</option>
            <option>Chaussures</option>
            <option>Manteau</option>
            <option>Chandail</option>
            <option>Bonnet</option>
        </select><br><br>

        <label for="quantite">Quantité</label><br>
        <input type="number" id="quantite" min="1" max="10" value="1"><br><br>

        <button type="submit">Commander</button>
    </form>
</body>
</html>
